services:
  postgres:
    image: postgres:16
    container_name: ticket-postgres

    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketdb

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ticket-redis
    ports:
      - "6380:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: ticket-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9093
    ports:
      - "9093:9092"

volumes:
  postgres_data: