services:
  postgres:
    image: postgres:16
    container_name: ticket-postgres
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ticket-redis
    ports:
      - "6380:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: ticket-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9093
    ports:
      - "9093:19092"

  api:
    build: .
    container_name: ticket-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://ticket:ticket@postgres:5432/ticketdb
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started

  outbox-worker:
    build: .
    container_name: ticket-outbox-worker
    command: python -m app.workers.outbox_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ticket:ticket@postgres:5432/ticketdb
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  order-consumer:
    build: .
    container_name: ticket-order-consumer
    command: python -m app.workers.order_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://ticket:ticket@postgres:5432/ticketdb
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

volumes:
  postgres_data: